<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | CarbonAxis Exchange</title>
  <link rel="stylesheet" href="/style.css?v=115" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#081511;padding:24px}
    .auth-box{width:100%;max-width:420px;background:rgba(255,255,255,.03);border:1px solid rgba(0,229,176,.15);border-radius:20px;padding:40px}
    .auth-box h1{text-align:center;margin-bottom:12px}
    .auth-box p.lead{text-align:center;color:#b8b8b8;margin-bottom:24px;line-height:1.5}
    .auth-box input{width:100%;padding:14px;margin-bottom:15px;border-radius:10px;border:none}
    .auth-btn{width:100%;padding:14px;border:none;border-radius:10px;background:#00e5b0;color:#000;font-weight:700;cursor:pointer}
    .auth-footer{text-align:center;margin-top:20px}
    .auth-footer a{color:#00e5b0}
    .auth-message{margin-top:15px;text-align:center;font-size:14px;font-weight:600}
    .auth-message.success{color:#00e5b0}
    .auth-message.error{color:#ff5c5c}
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <h1>Forgot password</h1>
      <p class="lead">Enter your account email and we'll send a reset link.</p>
      <form id="forgotForm">
        <input type="email" id="email" placeholder="Email Address" required />
        <button type="submit" class="auth-btn">Send reset link</button>
        <p id="msg" class="auth-message"></p>
      </form>
      <div class="auth-footer">
        <p><a href="/login.html">Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const msg = document.getElementById("msg");
    function show(text, type) {
      msg.textContent = text;
      msg.className = "auth-message " + type;
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      show("Sending...", "success");
      try {
        const res = await fetch(`${API.BASE}${API.forgotPassword}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        show(data.message || (data.success ? "Check your email." : "Request failed."), data.success ? "success" : "error");
      } catch {
        show("Unable to connect to server.", "error");
      }
    });
  </script>
</body>
</html>
