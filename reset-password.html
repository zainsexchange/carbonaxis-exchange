<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | CarbonAxis Exchange</title>
  <link rel="stylesheet" href="/style.css?v=115" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#081511;padding:24px}
    .auth-box{width:100%;max-width:420px;background:rgba(255,255,255,.03);border:1px solid rgba(0,229,176,.15);border-radius:20px;padding:40px}
    .auth-box h1{text-align:center;margin-bottom:12px}
    .auth-box p.lead{text-align:center;color:#b8b8b8;margin-bottom:24px;line-height:1.5}
    .auth-box input{width:100%;padding:14px;margin-bottom:15px;border-radius:10px;border:none}
    .auth-btn{width:100%;padding:14px;border:none;border-radius:10px;background:#00e5b0;color:#000;font-weight:700;cursor:pointer}
    .auth-footer{text-align:center;margin-top:20px}
    .auth-footer a{color:#00e5b0}
    .auth-message{margin-top:15px;text-align:center;font-size:14px;font-weight:600}
    .auth-message.success{color:#00e5b0}
    .auth-message.error{color:#ff5c5c}
    .hint{color:#8a8a8a;font-size:12px;margin:-8px 0 14px;line-height:1.4}
  </style>
  <meta name="description" content="Choose a new password for your CarbonAxis Exchange account.">
  <link rel="canonical" href="https://www.carbonaxisexchange.com/reset-password.html">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CarbonAxis Exchange">
  <meta property="og:title" content="Reset Password | CarbonAxis Exchange">
  <meta property="og:description" content="Choose a new password for your CarbonAxis Exchange account.">
  <meta property="og:url" content="https://www.carbonaxisexchange.com/reset-password.html">
  <meta property="og:image" content="https://www.carbonaxisexchange.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reset Password | CarbonAxis Exchange">
  <meta name="twitter:description" content="Choose a new password for your CarbonAxis Exchange account.">
  <meta name="twitter:image" content="https://www.carbonaxisexchange.com/og-image.png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <h1>Reset password</h1>
      <p class="lead">Choose a new password for your CarbonAxis account.</p>
      <form id="resetForm">
        <input type="password" id="password" placeholder="New password" required />
        <p class="hint">8+ chars with upper, lower, number, and special character.</p>
        <input type="password" id="confirm" placeholder="Confirm new password" required />
        <button type="submit" class="auth-btn">Update password</button>
        <p id="msg" class="auth-message"></p>
      </form>
      <div class="auth-footer">
        <p><a href="/login.html">Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const form = document.getElementById("resetForm");
    const msg = document.getElementById("msg");
    function show(text, type) {
      msg.textContent = text;
      msg.className = "auth-message " + type;
    }
    if (!token) {
      show("Missing reset token. Request a new link from Forgot password.", "error");
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (!token) {
        show("Missing reset token.", "error");
        return;
      }
      if (password !== confirm) {
        show("Passwords do not match.", "error");
        return;
      }
      show("Updating...", "success");
      try {
        const res = await fetch(`${API.BASE}${API.resetPassword}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (data.success) {
          show(data.message || "Password updated.", "success");
          setTimeout(() => { window.location.href = "/login.html"; }, 1200);
        } else {
          show(data.message || "Reset failed.", "error");
        }
      } catch {
        show("Unable to connect to server.", "error");
      }
    });
  </script>
</body>
</html>
