<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarbonAxis Admin Login</title>
  <meta name="description" content="CarbonAxis Exchange admin login — internal use only.">
  <link rel="canonical" href="https://www.carbonaxisexchange.com/admin-login.html">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    body {
      background: #081511;
      color: white;
      font-family: Inter, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      width: 380px;
      padding: 32px;
      background: #0f1f19;
      border: 1px solid rgba(0, 229, 176, 0.2);
      border-radius: 14px;
    }
    h2 { margin-top: 0; color: #00e5b0; }
    p { color: #9db0a9; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #06110e;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #00e5b0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .msg { margin-top: 12px; font-size: 13px; color: #ff7b7b; }
  </style>
</head>
<body>
  <div class="box">
    <h2>CarbonAxis Admin</h2>
    <p>Sign in with an admin account. No shared passwords in the browser.</p>
    <input type="email" id="email" placeholder="Admin email" autocomplete="username" />
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
    <button type="button" onclick="login()">Login</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      msg.textContent = "";

      try {
        const res = await fetch(`${API.BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!data.success) {
          msg.textContent = data.message || "Login failed";
          return;
        }

        if (data.user?.role !== "admin") {
          msg.textContent = "This account is not an admin.";
          return;
        }

        localStorage.setItem("adminToken", data.token);
        localStorage.setItem("adminUser", JSON.stringify(data.user));
        localStorage.setItem("adminLoggedIn", "true");
        window.location.href = "admin.html";
      } catch (err) {
        console.error(err);
        msg.textContent = "Network error";
      }
    }
  </script>
</body>
</html>
